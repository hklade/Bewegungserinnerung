name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Betroffene Bereiche ermitteln
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'src/**'
              - 'server/**'
              - 'shared/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'playwright.config.ts'
              - 'dev.playwright.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - 'server.mjs'
            android:
              - 'android/**'

  test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: test
      # Wirkt sich nicht auf die App-Logik aus (server/utils/time.mjs rechnet explizit
      # mit Intl.../timeZone: "Europe/Vienna", unabhängig von dieser Prozess-Env-Var).
      # Nur als Absicherung für Tooling/Logs, das sich auf die Prozesszeitzone verlässt.
      TZ: Europe/Vienna

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Server-Tests ausführen
        run: npm run test:server

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps

      - name: E2E-Tests ausführen (mit Allure-Report)
        run: npm run test:e2e
        continue-on-error: true
        id: e2e

      - name: Allure-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
          retention-days: 30

      - name: Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30 

      - name: E2E-Ergebnis auswerten
        if: always()
        run: |
          if [ "${{ steps.e2e.outcome }}" != "success" ]; then
            echo "E2E-Tests sind fehlgeschlagen."
            exit 1
          fi

      - name: Allure-Report als Artifact für Pages-Job vorbereiten
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pages-allure-report
          path: allure-report/
          retention-days: 30


  android-test:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      - name: Android-Unit-/Compose-UI-Tests ausführen
        run: ./gradlew testDebugUnitTest

      - name: Gradle-Testreport hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: ignore

      - name: JUnit-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: ignore

  coverage:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      NODE_ENV: test
      TZ: Europe/Vienna

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Server-Unit-Test-Coverage ausführen
        run: npm run test:server:coverage

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps

      - name: E2E-Coverage (Server + Client) ausführen
        run: npm run test:e2e:coverage

      - name: Coverage-Reports hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Coverage-HTML-Reports als Artifact für Pages-Job vorbereiten
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-coverage-report
          path: |
            coverage/server-unit-html/
            coverage/server-html/
            coverage/client-html/
          retention-days: 30

  deploy-report:
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    needs: [changes, test, coverage]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allure-Report herunterladen
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: pages-allure-report
          path: pages-root/allure

      - name: Coverage-Reports herunterladen
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: pages-coverage-report
          path: pages-root/coverage

      - name: Landingpage erzeugen
        run: |
          cat > pages-root/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head><meta charset="utf-8"><title>Bewegungserinnerung – Reports</title></head>
          <body>
            <h1>Bewegungserinnerung – Reports</h1>
            <ul>
              <li><a href="allure/">Allure E2E-Testreport</a></li>
              <li><a href="coverage/server-unit-html/">Server-Unit-Test-Coverage</a></li>
              <li><a href="coverage/server-html/">Server-E2E-Coverage</a></li>
              <li><a href="coverage/client-html/">Client-E2E-Coverage</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Pages-Artifact vorbereiten
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-root/

      - name: Reports auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
